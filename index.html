<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Applica il tema salvato PRIMA del CSS/paint: evita il flash del tema
      // sbagliato. THEME_VERSION (§12/D4): un bump invalida i temi salvati
      // vecchi — a versione diversa si riparte dal default dark.
      try {
        var THEME_VERSION = '5'
        if (localStorage.getItem('daemon_theme_v') !== THEME_VERSION) {
          localStorage.removeItem('daemon_theme')
          localStorage.setItem('daemon_theme_v', THEME_VERSION)
        }
        if (localStorage.getItem('daemon_theme') === 'light') document.documentElement.dataset.theme = 'light'
      } catch {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DÆMON HQ" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="description" content="DÆMON Production HQ — dashboard di produzione: drop, catalogo, design, tech pack, campioni, fornitori." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>DÆMON — Production HQ</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
